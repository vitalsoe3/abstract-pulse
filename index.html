<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Abstract Pulse</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="title">ABSTRACT PULSE</div>

    <div class="live">
      <span class="live-dot"></span>
      LIVE ON ABSTRACT
    </div>

    <div id="pulse" class="pulse">

      <div class="pulse-ring ring-one"></div>
      <div class="pulse-ring ring-two"></div>

      <div class="pulse-core">

        <!-- Abstract-inspired heart mark -->
        <svg class="abstract-logo"
             viewBox="0 0 100 100"
             xmlns="http://www.w3.org/2000/svg">

          <path
            d="M50 82
               C42 72 20 60 20 40
               C20 26 31 18 42 18
               C47 18 51 21 55 26
               C59 21 63 18 69 18
               C80 18 88 27 88 40
               C88 59 65 72 50 82Z"
          />

        </svg>

      </div>

    </div>

    <h1>
      ABSTRACT IS <span>ALIVE</span>
    </h1>

    <p class="tagline">
      Every block is a heartbeat. Every transaction makes it stronger.
    </p>

    <div class="stats">

      <div class="stat">
        <span>BLOCK</span>
        <strong id="blockNumber">Connecting...</strong>
      </div>

      <div class="stat">
        <span>TRANSACTIONS</span>
        <strong id="transactions">—</strong>
      </div>

      <div class="stat">
        <span>LAST HEARTBEAT</span>
        <strong id="heartbeat">—</strong>
      </div>

    </div>

    <div class="network">
      <span></span>
      ABSTRACT MAINNET · CHAIN ID 2741
    </div>

  </main>

  <script src="app.js"></script>

</body>
</html>
