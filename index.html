<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Abstract Pulse</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <div class="title">
      ABSTRACT PULSE
    </div>

    <div class="live">
      <span class="live-dot"></span>
      LIVE ON ABSTRACT
    </div>


    <!-- HEART -->

    <div class="heart-area">

      <div id="heart" class="heart">

        <img
          src="abstract-logo.jpg"
          class="abstract-logo"
          alt="Abstract logo"
        >

      </div>

    </div>


    <h1>
      ABSTRACT IS <span>ALIVE</span>
    </h1>

    <p class="tagline">
      Every block is a heartbeat. Every transaction makes it stronger.
    </p>


    <div class="stats">

      <div class="stat">
        <span>BLOCK</span>
        <strong id="blockNumber">
          Connecting...
        </strong>
      </div>

      <div class="stat">
        <span>TRANSACTIONS</span>
        <strong id="transactions">
          —
        </strong>
      </div>

      <div class="stat">
        <span>LAST HEARTBEAT</span>
        <strong id="heartbeat">
          —
        </strong>
      </div>

    </div>


    <div class="network">
      <span></span>
      ABSTRACT MAINNET · CHAIN ID 2741
    </div>

  </main>


  <script src="app.js"></script>

</body>
</html>
